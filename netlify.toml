[build]
  command = "pnpm run build:netlify"
  publish = "build/client"

[build.environment]
  # Increase Node heap during Netlify builds and preload a project shim to provide minimal
  # browser globals (File/Blob/FormData) during install/build. Use an absolute path so
  # postinstall hooks invoked from different CWDs can still resolve the file.
  NODE_OPTIONS = "--max-old-space-size=4096 --require=/opt/build/repo/scripts/node-shims.cjs"
  # Pin a Netlify Node version known to play nicely with native deps (esbuild/workerd).
  # Using a concrete recent 18.x LTS avoids odd Node 20.x patch incompatibilities in some packages.
  NODE_VERSION = "18.20.2"

  [[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
