[build]
  command = "pnpm run build:netlify"
  publish = "build/client"

[build.environment]
  # Increase Node heap during Netlify builds
  # Preload tiny shims to provide minimal browser globals (File/Blob/FormData)
  # and increase Node heap during Netlify builds.
  NODE_OPTIONS = "--max-old-space-size=4096 --require=./scripts/node-shims.cjs"
  # Pin a Netlify Node version known to play nicely with native deps (esbuild/workerd).
  # Using a concrete recent 18.x LTS avoids odd Node 20.x patch incompatibilities in some packages.
  NODE_VERSION = "18.20.2"
